name: Build Android APK (C++ Native)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK with Gradle & NDK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build_output
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} build_output/SAMP-TextDraw-Editor.apk \;
          echo "Generated APK size:"
          ls -lh build_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAMP-TextDraw-Editor-Release-APK
          path: build_output/SAMP-TextDraw-Editor.apk
          if-no-files-found: error
