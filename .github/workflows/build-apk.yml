name: Build Android APK (C++ Native)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Configure NDK
        run: |
          echo "Accepting Android SDK licenses..."
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          echo "Preinstalled NDKs:"
          ls -la "$ANDROID_SDK_ROOT/ndk" 2>/dev/null || true
          NDK_DIR=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | tail -n 1)
          if [ -n "$NDK_DIR" ]; then
            echo "Using preinstalled NDK: $NDK_DIR"
            echo "ndk.dir=$NDK_DIR" > local.properties
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK with Gradle & NDK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build_output
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} build_output/SAMP-TextDraw-Editor.apk \;
          echo "Generated APK size:"
          ls -lh build_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAMP-TextDraw-Editor-Release-APK
          path: build_output/SAMP-TextDraw-Editor.apk
          if-no-files-found: error
